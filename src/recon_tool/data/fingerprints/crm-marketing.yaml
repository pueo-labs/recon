# CRM, sales, marketing, and advertising fingerprints. Marketing automation, sales intelligence, ad platforms.
#
# Loaded by recon_tool.fingerprints.load_fingerprints.
# Custom overrides: ~/.recon/fingerprints.yaml (additive only).

fingerprints:
- name: Salesforce
  slug: salesforce
  category: CRM & Marketing
  confidence: high
  parent_vendor: Salesforce
  detections:
  - type: txt
    pattern: ^salesforce-domain-verification=
    reference: https://help.salesforce.com/s/articleView?id=sf.domain_name_overview.htm
    description: >-
      Salesforce domain-verification TXT. Indicates the domain
      is administratively bound to a Salesforce org, typically
      for SSO federation or Experience Cloud custom-domain
      setup. Does not by itself identify which Salesforce
      product (Sales Cloud, Service Cloud, Experience Cloud,
      Marketing Cloud) is in use.
  - type: txt
    pattern: ^00D[A-Za-z0-9]{12,15}=
    reference: https://help.salesforce.com/s/articleView?id=sf.domain_name_overview.htm
    description: >-
      Salesforce Organization ID (the `00D` prefix is the
      fixed identifier for Org records in Salesforce's
      object-prefix scheme). Indicates the domain has been
      verified to a specific Salesforce org. The OrgID itself
      is a unique tenant identifier; presence proves an
      administrative CRM relationship between the domain owner
      and a Salesforce org.
  - type: spf
    pattern: salesforce.com
    reference: https://help.salesforce.com/s/articleView?id=sf.domain_name_overview.htm
    description: >-
      SPF include matching salesforce.com. Authorizes Salesforce
      to send mail on behalf of the domain, typically for
      Salesforce-initiated emails (case responses, Marketing
      Cloud sends through the platform, automated workflows).
  - type: spf
    pattern: _spf.salesforce.com
    reference: https://help.salesforce.com/s/articleView?id=xcloud.emailadmin_spf_include_salesforce.htm&language=en_US&type=5
    verified: '2026-10-30'
    description: >-
      SPF include `_spf.salesforce.com`. The current Salesforce
      include guide says to add `include:_spf.salesforce.com` when
      sending mail from the Salesforce application. This observes
      that include. It does not prove messages are being sent.
      The same guide says other salesforce.com SPF records are a
      separate case and are not part of this rule.
- name: Salesforce Marketing Cloud
  slug: salesforce-mc
  category: CRM & Marketing
  confidence: high
  product_family: Salesforce Marketing Cloud
  parent_vendor: Salesforce
  detections:
  - type: cname
    pattern: sfmc-marketing.com
    reference: https://help.salesforce.com/s/articleView?id=mktg.mc_es_ip_addresses_for_inclusion.htm&language=en_US&type=5
    verified: '2026-08-20'
    description: >-
      CNAME pointing into sfmc-marketing.com. Salesforce's current
      allowlist identifies this family for Marketing Cloud Engagement
      view-as-web-page URLs when an SAP domain is not applied. This
      observes an SFMC-hosted web-view endpoint, not campaign activity.
  - type: cname
    pattern: sfmc-content.com
    reference: https://help.salesforce.com/s/articleView?id=000389721&language=en_US&type=1
    verified: '2026-08-20'
    description: >-
      CNAME pointing into sfmc-content.com. Salesforce's current
      CloudPages transition guide documents tenant-specific public
      hosts under `*.pub.sfmc-content.com`. This observes SFMC-hosted
      CloudPages or content, not a product edition or campaign state.
  - type: cname
    pattern: exacttarget.com
    reference: https://help.salesforce.com/s/articleView?id=000383566&language=en_US&type=1
    verified: '2026-08-20'
    description: >-
      CNAME pointing into exacttarget.com. Salesforce's current stack
      guide documents Marketing Cloud Engagement application hosts
      such as `mc.s7.exacttarget.com`. This observes routing to an SFMC
      application host, not the tenant's API or sending configuration.
- name: HubSpot
  slug: hubspot
  category: CRM & Marketing
  confidence: high
  detections:
  - type: txt
    pattern: ^hubspot-domain-verification=
    reference: https://knowledge.hubspot.com/website-pages/connect-a-domain-to-hubspot
    description: >-
      HubSpot domain-verification TXT. Indicates the domain is
      registered with a HubSpot account, typically for hosting
      HubSpot-served landing pages, blog posts, or marketing
      sends under a branded subdomain. Does not identify
      which HubSpot Hubs (Marketing, Sales, Service, CMS) are
      licensed.
  - type: txt
    pattern: ^hubspot-developer-verification=
    reference: https://knowledge.hubspot.com/website-pages/connect-a-domain-to-hubspot
    description: >-
      HubSpot developer-portal or sandbox-account domain
      verification TXT. Used for verifying domains against
      HubSpot's developer test accounts rather than production.
      Presence suggests a development team is using HubSpot
      tooling; less indicative of production HubSpot use.
  - type: spf
    pattern: hubspotemail.net
    reference: https://knowledge.hubspot.com/marketing-email/manage-email-authentication-in-hubspot
    verified: '2026-08-20'
    description: >-
      SPF include under hubspotemail.net. HubSpot's current
      email-authentication guide shows account- and pool-qualified
      values such as 123456.spf03.hubspotemail.net. This authorizes
      HubSpot email sending; it does not establish inbound routing or
      identify a licensed Hub.
  - type: cname
    pattern: hubspot.net
    reference: https://developers.hubspot.com/docs/api-reference/legacy/cms/domains/guide
    verified: '2026-08-20'
    description: >-
      CNAME pointing into hubspot.net. HubSpot's current Domains API
      guide shows expectedCname values such as
      8675309.group39.sites.hubspot.net for a connected domain. This
      indicates HubSpot-hosted content under a branded hostname, not a
      specific product tier.
