  slug: mxrecord
  category: Email
  confidence: high
  detections:
  - type: mx
    pattern: mxrecord.mx
    reference: https://developers.cloudflare.com/email-security/deployment/inline/setup/gsuite-area1-mx/
    verified: '2026-11-16'
    description: >-
      MX host under the documented Cloudflare Email Security
      exchanger `mailstream-central.mxrecord.mx`. The Google
      Workspace deployment guide prints that host as an MX
      record. This observes an MX host under `mxrecord.mx`. It
      does not prove that mail is delivered or that Cloudflare
      Email Security is the only exchanger.
- name: Fastmail
  slug: fastmail
  category: Email
  confidence: high
  detections:
  - type: mx
    pattern: messagingengine.com
    reference: https://www.fastmail.help/hc/en-us/articles/1500000280261-Setting-up-your-domain-MX-only
    verified: '2026-11-16'
    description: >-
      MX host under the documented Fastmail exchanger
      `in1-smtp.messagingengine.com`. This observes an MX
      host under `messagingengine.com`. It does not prove
      that mail is delivered or that Fastmail is the only
      exchanger.
- name: Hornetsecurity
  slug: hornetsecurity
  category: Email
  confidence: high
  detections:
  - type: mx
    pattern: hornetsecurity.com
    reference: https://support.hornetsecurity.com/hc/en-us/articles/45997388779537-Migration-for-Vade-Cloud-Customers
    verified: '2026-11-16'
    description: >-
      MX host under a documented Hornetsecurity exchanger
      `vade-mx-fr01.hornetsecurity.com`. The Vade Cloud
      migration article prints that host as an MX record.
      This observes an MX host under `hornetsecurity.com`.
      It does not prove that mail is delivered or that
      Hornetsecurity is the only exchanger.
- name: AppRiver (Zix)
  slug: appriver
  parent_vendor: Zix
  category: Email
  confidence: high
  detections:
  - type: mx
    pattern: arsmtp.com
    description: >-
      AppRiver / Zix email-security gateway MX target (`arsmtp.com`).
      Indicates inbound mail is filtered by AppRiver before delivery.
- name: TitanHQ
  slug: titanhq
  category: Security
  confidence: high
  detections:
  - type: mx
    pattern: titanhq.com
    description: >-
      TitanHQ (SpamTitan email security) MX target (`titanhq.com`).
      Indicates inbound mail is filtered by SpamTitan.
- name: Apple iCloud Mail
  slug: icloud-mail
  category: Email
  confidence: high
  detections:
  - type: mx
    pattern: icloud.com
    reference: https://support.apple.com/en-us/102374
    verified: '2026-11-16'
    description: >-
      MX host under the documented iCloud Mail exchanger
      `mx01.mail.icloud.com`. The custom-domain article prints
      that host, and `mx02.mail.icloud.com`, as MX records.
      This observes an MX host under `icloud.com`. It does not
      prove that mail is delivered or that iCloud Mail is the
      only exchanger.
- name: Iberlayer Mailguard
  slug: iberlayer
  category: Email
  confidence: high
  detections:
  - type: mx
    pattern: iberlayer.com
    description: >-
      Iberlayer Mailguard (Spanish email security) MX target
      (`iberlayer.com`). Common on Iberian-market apexes for inbound
      mail filtering.
