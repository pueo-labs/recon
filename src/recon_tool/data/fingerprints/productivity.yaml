      Undated catalog variant without the hyphen after `status`. Atlassian's
      current DNS guide instead documents
      `status-page-domain-verification=` for a custom notification-sending
      domain. No current first-party page reviewed on 2026-08-21 names this
      variant; it is retained as a legacy observation only and does not
      establish page hosting, SSO, or active use.
  - type: cname
    pattern: statuspage.io
    description: >-
      Undated catalog observation of an apex or `www` CNAME into
      `statuspage.io`. Atlassian currently documents `statuspage.io` for
      default page hostnames but directs custom-domain CNAMEs to
      `stspg-customer.com`. This does not establish current page hosting,
      visibility, ownership, or incident activity.
