name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Match setup-python's maintained patch release instead of the exact local pin.
# Matrix jobs override this with their selected interpreter.
env:
  UV_PYTHON: "3.15"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches unresolved action refs, bad shell in `run:` blocks, and
      # deprecated expressions before any Python job spins up. The v1.0.2
      # release regressed because `astral-sh/setup-uv@v8` isn't a real
      # floating tag; actionlint catches that class of error locally and
      # in CI.
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check --no-cache .

      - name: Check formatting
        run: uv run ruff format --check .

  optional-cloud-draft-artifacts:
    # These checks keep the optional draft internally consistent. They do not
    # establish that it has been deployed or validated on a real provider.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check draft Cloud Run Terraform syntax
        run: |
          terraform fmt -check -recursive deploy/gcp-cloud-run
          terraform -chdir=deploy/gcp-cloud-run init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/gcp-cloud-run validate

      - name: Build draft remote container
        run: docker build --file deploy/container/Dockerfile --tag recon-remote:ci .

      - name: Smoke-test draft remote container locally
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -base64 48 | tr -d '\n')"
          docker run --detach --name recon-remote-ci --publish 18080:8080 \
            --env RECON_REMOTE_BEARER_TOKEN="$token" recon-remote:ci
          trap 'docker rm --force recon-remote-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs recon-remote-ci
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{}' http://127.0.0.1:18080/mcp)" = "401"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync

      - name: Type check
        # pyproject.toml is the single source of truth for the checked scope.
        run: uv run pyright

      - name: Audit retained typing exceptions
        run: uv run python scripts/check_typing_policy.py

  mcp-compatibility:
    # Exercise the exact v1 rollback SDK and production v2 SDK in isolated
    # environments. Keep rollback, production floor, and current stable SDK
    # blocking; production depends on mcp>=2.0.0,<3.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["1.28.1", "2.0.0", "2.3.0"]
    env:
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install locked development environment
        run: uv sync --locked

      - name: Probe MCP SDK ${{ matrix.mcp-version }}
        run: >-
          uv run python scripts/check_mcp_compatibility.py
          --sdk-version "${{ matrix.mcp-version }}"
          --require-compatible "${{ matrix.mcp-version }}"

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Every maintained CPython release. 3.11 is the supported floor
        # (requires-python and pyright pythonVersion); single-version jobs
        # elsewhere run the newest stable release, 3.15.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Free-threaded 3.15 (PEP 703/779), Ubuntu only, as a
          # dependency-compatibility probe. recon is asyncio-based with no
          # shared mutable thread state, so the value here is catching a
          # dependency without a cp315t wheel before a user on
          # free-threaded Python hits it. Marked experimental so it does
          # not block CI: a missing cp315t wheel reports, it does not fail.
          # At 3.15.0 the locked cryptography (abi3 wheels only, no cp315t)
          # and PyYAML (no 3.15 wheels) must build from source here.
          - os: ubuntu-latest
            python-version: "3.15t"
            experimental: true
    # `.python-version` pins the local and dev toolchain to 3.15. In CI the
    # matrix has to win, so force uv to the matrix interpreter; without this
    # uv reads `.python-version` and runs every matrix job on 3.15, which
    # would silently defeat the 3.11 / 3.12 / 3.13 / 3.14 coverage.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    # Non-blocking only for the experimental free-threaded probe above;
    # every other matrix job fails CI as normal.
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Test parallel suite with coverage
        run: >-
          uv run pytest tests/ --ignore=tests/test_mcp_doctor.py
          -n auto --maxprocesses=4 --dist=loadfile
          --cov=src/recon_tool --cov-branch --cov-report= --cov-fail-under=0 -q

      - name: Test live MCP doctor serially and enforce coverage
        run: >-
          uv run pytest tests/test_mcp_doctor.py -n 0
          --cov=src/recon_tool --cov-branch --cov-append
          --cov-fail-under=90.2 -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # uv reads `.python-version` (the 3.15 dev pin) unless UV_PYTHON is set.
      # Pin the audit's uv sync / export / pip-audit explicitly to the
      # interpreter setup-python installs below, so a future dev-pin change
      # cannot silently audit a different environment. Mirror the test
      # matrix, which sets UV_PYTHON for the same reason.
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync

      - name: Export all locked requirements
        # Hash-pinned (no --no-hashes): per-package sha256 hashes are
        # included so the audit reads a hash-pinned surface. Kept in
        # lockstep with release.yml, including optional tooling and extras.
        # pip-audit handles hashed requirements.
        run: uv export --frozen --all-groups --all-extras --no-emit-project --format requirements.txt --output-file .ci-audit-requirements.txt

      - name: Audit dependencies
        # uv already resolved every group. Avoid pip bootstrapping and its
        # separately vendored HTTP dependencies while reading this exact graph.
        run: uv run python scripts/run_dependency_audit.py --disable-pip -r .ci-audit-requirements.txt

  validate-fingerprints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Repository-policy checks need HEAD^ and historical commit objects.
          # Fetch history once while the broad test matrix stays shallow.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync

      - name: Validate documentation commit receipts
        shell: bash
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Documentation receipt validation requires full Git history."
            exit 1
          fi
          uv run pytest tests/test_documentation_integrity.py::test_backticked_commit_receipts_exist

      - name: Validate built-in fingerprints
        # Validates every ``*.yaml`` under ``data/fingerprints/`` and
        # pools slugs across files for a cross-file duplicate-slug check.
        # The validator accepts a directory as of v1.1 (same CLI, different
        # argument shape).
        run: uv run python scripts/validate_fingerprint.py src/recon_tool/data/fingerprints/ --quiet

      - name: Enforce generated fingerprint artifact
        # The split YAML files are canonical contributor source. Runtime uses
        # one deterministic generated JSON artifact, and drift blocks CI.
        run: uv run python scripts/generate_fingerprint_catalog.py --check

      - name: Enforce fingerprint metadata coverage (v1.9.7+)
        # Per-detection presence gate: every detection in every
        # category must carry a non-empty ``description`` field.
        # Flipped from advisory (``--report-only``) to enforcing in
        # v1.9.7 once the catalog was backfilled to 100 percent.
        # The script emits the exact slug + detection-rule pairs
        # missing a description on failure so a contributor sees
        # "fix these N entries" rather than a percentage.
        run: uv run python scripts/check_metadata_coverage.py

      - name: Review witnessed catalog overlaps
        run: uv run python -m scripts.check_catalog_overlaps

      - name: Enforce verification dates on new fingerprint detections
        # A branch-creation push (including renaming the default branch away and
        # back) reports ``github.event.before`` as all zeros, which is not a
        # revision and made this step fail with "Needed a single revision" on a
        # tree that had not changed. Fall back to the first parent, matching how
        # the text-hygiene step below resolves the same event.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          elif [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$(git rev-parse --verify --quiet HEAD^ || true)"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ]; then
            echo "No usable base revision for this event; skipping freshness diff."
            exit 0
          fi
          uv run python scripts/check_fingerprint_freshness.py --base-ref "$base"

      - name: Enforce validation artifact hygiene
        # Release and calibration artifacts may publish aggregate statistics
        # only. This catches forced-added private run paths, root per-domain
        # dumps, corpus lines, and target-domain fields in committed validation
        # artifacts before they reach main.
        run: uv run python scripts/check_validation_hygiene.py

      - name: Enforce frozen agent-portability evaluation contract
        # The v2.15 client frame, pinned standards snapshot, privacy boundary,
        # and promotion thresholds must pass before portable packaging work.
        run: uv run python -m validation.agent_portability_contract

      - name: Enforce deterministic Agent Plugins candidate
        # Native skill sources generate the complete portable package. Drift in
        # either representation fails before representative-client collection.
        run: uv run python scripts/generate_agent_plugin.py --check

      - name: Enforce the Claude Code marketplace
        # The repository marketplace is generated from the plugin manifest and
        # the project version. This check does not invoke the claude binary.
        run: uv run python scripts/generate_claude_marketplace.py --check

      - name: Enforce the MCP Registry metadata
        # server.json is generated from the project version and checked against
        # the vendored 2025-12-11 schema. This check does not publish it.
        run: uv run python scripts/generate_mcp_registry.py --check

      - name: Validate schema-pinned Agent Plugins candidate
        # Uses only the byte-pinned vendored Working Draft schemas and rejects
        # unsafe launch shapes, client-only skill fields, and package drift.
        run: uv run python scripts/check_agent_plugin.py

      - name: Enforce workflow action pins
        # Build and release actions are pinned to immutable SHAs, with version
        # comments kept beside the pins for maintainability.
        run: uv run python scripts/check_workflow_pins.py

      - name: Enforce zero paid API cost surface
        # The packaged runtime and GitHub automation must not grow paid-provider
        # SDKs, model API keys, image API calls, or validation-only paid harness
        # invocations. Optional maintainer validation harnesses stay outside the
        # wheel and outside workflows.
        run: uv run python scripts/check_cost_surface.py

      - name: Enforce added-line text hygiene
        # New diff lines must not add attribution markers, em dashes, or
        # pictographic symbols. Historical prose is not part of this check.
        shell: bash
        # Event fields reach the shell through env rather than by expanding
        # into the script body. Every field here is a GitHub-supplied SHA, so
        # this is pattern hygiene rather than a live injection fix, and it keeps
        # one safe shape for the next step that interpolates something freer.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$HEAD_SHA^!"
          else
            range="$BEFORE_SHA..$HEAD_SHA"
          fi
          uv run python scripts/check_text_hygiene.py --range "$range"
          # Trailers and bot identities live in commit metadata, not in the
          # diff, so the range above cannot see them. Fail the pull request
          # here, while its head can still be rewritten: once merged, the
          # refs/pull/*/head copy is retained by GitHub permanently.
          uv run python scripts/check_text_hygiene.py --commits "$range"

      - name: Enforce Markdown links and heading anchors
        run: uv run python scripts/check_markdown_links.py

      - name: Enforce renderable math and non-hollow sections
        # Guard delimiters, GitHub-rejected macros, Mermaid keyword collisions,
        # and pointer stubs that resolve as anchors while carrying no content.
        run: uv run python scripts/check_doc_rot.py

      - name: Enforce generated synthetic terminal demo
        # README shows the real default renderer over a reserved no-network
        # fixture. Block stale screenshots when panel behavior changes.
        run: uv run python scripts/generate_terminal_demo.py --check

      - name: Enforce ClusterFuzzLite requirements export
        # The PR fuzzing build installs only hash-pinned runtime requirements.
        # Keep the committed export in lockstep with uv.lock.
        run: uv run python scripts/check_clusterfuzzlite_requirements.py

      - name: Enforce schema source map
        # Every top-level JSON Schema field must trace to a model field or an
        # explicit formatter, envelope, batch, or explain-mode source.
        run: uv run python scripts/check_schema_sources.py

      - name: Enforce generated schema
        # The published schema copies are generated from the runtime required
        # field mirror plus the explicit conditional-field metadata.
        run: uv run python scripts/generate_schema.py --check

      - name: Enforce generated surface inventory
        # The surface inventory is derived from the CLI, MCP registry, and JSON
        # schema. Keep it current so docs and agent guidance do not drift from
        # the runtime surface.
        run: uv run python scripts/generate_surface_inventory.py --check

      - name: Enforce default-claim audit coverage
        # New material panel, JSON, MCP, guidance, recommendation, and score
        # surfaces must declare a claim family and direct evidence path.
        run: uv run python scripts/check_default_claim_audit.py

      - name: Enforce generated CLI surface reference
        # The Markdown CLI reference is generated from the live Typer command
        # tree and must stay in sync with the generated inventory.
        run: uv run python scripts/generate_surface_inventory.py --check-cli-surface

      - name: Enforce zero EXPERIMENTAL labels (v1.9.11+)
        # v2.0 quality bar: no active EXPERIMENTAL label on any
        # operator-facing surface (CLI help, MCP tool descriptions,
        # JSON schema field descriptions, schema reference docs).
        # The script pattern-matches for label shapes (parens /
        # brackets / prefixes / Stability-column markdown) and
        # allows past-tense prose discussion in roadmap and
        # migration docs.
        run: uv run python scripts/check_no_experimental_labels.py

      - name: Enforce package interface layout
        # Public CLI, formatter, MCP, and import boundaries must stay in their
        # maintained modules rather than drifting back into facade god files.
        run: uv run python scripts/check_interface_layout.py

      - name: Enforce the file-size ratchet (no god files)
        # New modules cap at 1000 lines; the oversized modules predating the
        # guard are baselined as ceilings that may only shrink (see
        # scripts/check_file_size.py and the decomposition track in roadmap.md).
        run: uv run python scripts/check_file_size.py

      - name: Enforce PLR size-rule ratchet
        # Ruff's PLR0911, PLR0912, PLR0913, and PLR0915 rules block new
        # function-size debt while the existing debt is paid down deliberately.
        run: uv run python scripts/check_plr_ratchet.py

  hostile-input-fuzz:
    # Dedicated gate for the adversarial / oversized / malformed parser tests and
    # the Hypothesis fuzz suites (the `hostile_input` marker). Promotes them from
    # incidental coverage under the `test` job to an authoritative, separately
    # visible gate, run at a higher Hypothesis example budget (RECON_FUZZ). The
    # same tests still run inside `test` (where they count toward coverage); this
    # job exists so a parser-bound regression is its own red check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pin the interpreter explicitly rather than inheriting .python-version.
      UV_PYTHON: "3.15"
      # Load the higher-budget Hypothesis profile (conftest.py) for this job.
      RECON_FUZZ: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync

      - name: Run hostile-input fuzz gate
        run: uv run pytest tests/ -m "hostile_input and not integration"

  reproducible-build:
    # Same-job deterministic-build check. With a fixed SOURCE_DATE_EPOCH, two
    # builds of the same source in this Ubuntu job must produce matching wheel
    # and sdist hashes under the same exact uv and hash-locked backend graph.
    # This does not claim byte identity across different Python, runner, or
    # operating-system environments. Builds go to
    # RUNNER_TEMP (outside the checkout) so build output never lands in the
    # packaged source tree and falsely breaks the comparison.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.15"
      # A fixed epoch so the two builds below share pinned file mtimes; the
      # value is arbitrary (this gate tests determinism, not the release stamp).
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Build twice and compare artifact hashes
        run: |
          set -euo pipefail
          build_once() {
            out_dir="$1"
            uv build --sdist --out-dir "$out_dir" --build-constraints build-constraints.txt --require-hashes
            sdists=("$out_dir"/*.tar.gz)
            if [ "${#sdists[@]}" -ne 1 ] || [ ! -f "${sdists[0]}" ]; then
              echo "Expected exactly one source distribution in $out_dir" >&2
              exit 1
            fi
            uv build --wheel "${sdists[0]}" --out-dir "$out_dir" --build-constraints build-constraints.txt --require-hashes
          }
          build_once "$RUNNER_TEMP/r1"
          build_once "$RUNNER_TEMP/r2"
          fail=0
          for f in "$RUNNER_TEMP/r1"/*.whl "$RUNNER_TEMP/r1"/*.tar.gz; do
            name="$(basename "$f")"
            h1="$(sha256sum "$RUNNER_TEMP/r1/$name" | cut -d' ' -f1)"
            h2="$(sha256sum "$RUNNER_TEMP/r2/$name" | cut -d' ' -f1)"
            if [ "$h1" = "$h2" ]; then
              echo "reproducible: $name ($h1)"
            else
              echo "NOT REPRODUCIBLE: $name ($h1 != $h2)" >&2
              fail=1
            fi
          done
          exit "$fail"

      - name: Upload wheel for installed-artifact checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-wheel
          path: ${{ runner.temp }}/r1/*.whl
          if-no-files-found: error

  installed-wheel-smoke:
    # The same built artifact must work without an editable install or source
    # YAML. These are offline CLI/MCP contracts and emulated manifest launches,
    # not claims of real external client acceptance.
    needs: reproducible-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download built wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-wheel
          path: ${{ runner.temp }}/wheel-smoke-dist

      - name: Check installed wheel offline contracts
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/check_installed_wheel.py --wheel "$RUNNER_TEMP/wheel-smoke-dist" \
            --manifest agents/agent-plugin/mcp.json --version "$version"

  ci-gate:
    if: always()
    needs:
      - workflow-lint
      - lint
      - optional-cloud-draft-artifacts
      - typecheck
      - mcp-compatibility
      - test
      - audit
      - validate-fingerprints
      - hostile-input-fuzz
      - reproducible-build
      - installed-wheel-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every blocking CI job
        shell: bash
        env:
          BLOCKING_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["BLOCKING_RESULTS"])
          failed = sorted(
              name
              for name, detail in results.items()
              if detail.get("result") != "success"
          )
          if failed:
              print("Blocking CI jobs did not pass: " + ", ".join(failed))
              sys.exit(1)
          print(f"All {len(results)} blocking CI jobs passed.")
          PY
