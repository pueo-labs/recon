[project]
name = "recon-tool"
version = "2.27.1"
description = "Public-metadata domain intelligence CLI and MCP server using DNS, certificate transparency, and unauthenticated identity discovery."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["dns", "osint", "recon", "domain-intelligence", "mcp", "security", "saas-fingerprinting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.27.3",
    "rich>=13.0",
    "httpx>=0.27",
    # Public connection-backend API pins validated IPs without changing TLS
    # hostname verification or depending on HTTPX's private pool attributes.
    "httpcore[asyncio]>=1.0.9,<2",
    # Authenticated public DNS for lower-trust MCP callers. The DoH extra
    # supplies the library's HTTP/2 transport without a second DNS client.
    # Security floor: 2.9.0 fixes CVE-2026-114605 (GHSA-45c3-73f7-pv4m), excess
    # CPU in name decompression of untrusted wire messages, which recon parses.
    "dnspython[doh]>=2.9.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    # v2 is the SDK line that speaks MCP 2026-07-28. Serving that revision is
    # what makes recon reachable from a modern-only client at all: the spec's
    # compatibility matrix says modern client plus legacy server fails, and
    # server/discover, per-request _meta, resultType, and cache hints are all
    # SDK-provided. A v2 server still answers the legacy initialize handshake,
    # so clients on 2025-11-25 keep working; recon's own gate verifies that
    # rather than trusting it. 1.28.1 stays the documented rollback pin and
    # stays blocking in the compatibility matrix, so both generations remain
    # exercised. See docs/mcp-2026-07-28-readiness.md.
    "mcp>=2.0.0,<3",
    "networkx>=3.0",
    # Runtime validation applies the exact packaged Draft 2020-12 ReviewBundle
    # contract after semantic integrity checks. Keep this direct even while MCP
    # also pulls it transitively so the public loader never relies on SDK shape.
    "jsonschema>=4.23,<5",
    # Public Suffix List for registrable-domain (apex) reduction, so a pasted
    # browser URL or sub-host (mail.example.co.uk) is analyzed at the apex
    # (example.co.uk) where recon's signal lives (MX, tenant, _dmarc, CT). Naive
    # last-two-labels logic mishandles ccTLDs; this carries the real PSL.
    # Pure-Python with zero required runtime dependencies, bundles the list and
    # ships its own updater, so it stays within recon's lean, offline,
    # no-C-extension dependency floor.
    "publicsuffixlist>=1.0",
    # Design-by-Contract. Pure-Python, so it does not breach the
    # no-C-extension floor. Contracts (pre / post / inv) document and
    # enforce the inference-core invariants under test and local dev, and
    # are turned into no-ops in production via `deal.disable()` when
    # `__debug__` is false (see src/recon_tool/__init__.py), so installed users
    # pay no runtime cost.
    "deal>=4.24.0",
    # Security floor on a transitive dependency: mcp pulls in python-multipart,
    # and 0.0.26 has CVE-2026-42561 (fix: 0.0.27). Pinned here so resolvers and
    # `pip-audit` stay green until mcp's own floor catches up.
    "python-multipart>=0.0.27",
    # Security floors on the HTTPX v2 packages mcp pulls in. httpcore2 2.9.1 is
    # CVE-2026-84381 (fix: 2.10.0). httpx2 2.9.1 is CVE-2026-84378 through
    # CVE-2026-84382 (fix: 2.12.0). Keep the floors until mcp's own pins catch up.
    "httpcore2>=2.10.0",
    "httpx2>=2.12.0",
    # Carry the patched AnyIO floor into installed wheels as well as uv.lock,
    # so pip upgrades cannot retain an older affected transitive dependency.
    "anyio>=4.14.2",
    # MCP's JWT dependency must include the 2.14 security fixes even when pip
    # reuses an existing environment. Keep this floor until MCP requires it.
    "pyjwt>=2.14.0",
    # PYSEC-2026-4320: exclude the compromised emSign trust root from HTTPX's
    # default CA bundle, including when pip reuses an existing environment.
    "certifi>=2026.10.19",
    # MCP extracts untrusted JSON-RPC trace metadata through this parser.
    # Exclude quadratic tracestate parsing (CVE-2026-114603).
    "opentelemetry-api>=1.45.1",
]

[project.scripts]
recon = "recon_tool.cli:run"

[project.urls]
Homepage = "https://github.com/pueo-labs/recon"
Repository = "https://github.com/pueo-labs/recon"
Changelog = "https://github.com/pueo-labs/recon/blob/main/CHANGELOG.md"
Issues = "https://github.com/pueo-labs/recon/issues"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_tool"]
exclude = ["src/recon_tool/data/fingerprints/*.yaml"]

# Hatchling's VCS filtering does not reliably re-apply nested ignore rules after
# a parent validation directory is re-included. Keep private operator artifacts
# outside the sdist with an explicit, release-tested denylist as well.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.agent/**",
    "/validation/agent-portability-local/**",
    "/validation/agentic_ux/local/**",
    "/validation/agentic_ux/runs/**",
    "/validation/corpus-private/**",
    "/validation/live_runs/**",
    "/validation/local/**",
    "/validation/runs-private/**",
]

# PEP 735 dependency group. uv treats `dev` as a default group, so
# `uv sync` installs it and `uv sync --no-dev` / `uv export --no-dev`
# exclude it. Unlike the old `[project.optional-dependencies]`, these are
# not published as an installable extra, so `pip install recon-tool[dev]`
# no longer pulls the test toolchain (that was never a real use case).
[dependency-groups]
build = [
    # Exact root for the hash-locked isolated artifact build graph exported to
    # build-constraints.txt. This group is not installed by default.
    "hatchling==1.33.0",
]
# Provider SDKs are confined to the optional, maintainer-invoked validation
# harness. Exact roots plus uv.lock make those paid-network tools reproducible
# without adding either SDK to recon's runtime or default development graph.
agentic-validation = [
    "anthropic==0.125.0",
    "openai==2.54.0",
]
dev = [
    "hypothesis>=6.0",
    # The Markdown gate wraps v4 inline rules to retain exact source offsets.
    # Verify that integration before allowing a new parser major version.
    "markdown-it-py>=4.0,<5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "pre-commit>=3.0",
    # pre-commit creates hook environments with virtualenv. Keep its activation,
    # configuration, launcher and seed-wheel fixes current, including the
    # prompt and exclusive-write fixes in 21.14.13.
    "virtualenv>=21.14.13",
    # Shared development-tool dependency; reject the ReadWriteLock SQLite
    # side-file issue (CVE-2026-112940), fixed upstream in 4.2.1.
    "filelock>=4.2.1",
    # Security floor on development tooling: pip-api pulls in pip, and pip
    # before 26.2 has PYSEC-2026-3721 / CVE-2026-13346. pip is excluded from
    # the published runtime graph. 26.2.2 also refreshes its bundled certifi.
    "pip>=26.2.2",
    "pip-audit>=2.7",
    # pip-audit uses Requests. Keep its transport above the proxy-TLS and
    # chunk-size fixes (CVE-2026-97687 and CVE-2026-97689), outside runtime.
    "urllib3>=2.8.0",
]
# Mutation-testing gate (the `mutation-gate` CI workflow). Separate group so
# the per-push dev environment stays lean; cosmic-ray is pulled only by the
# mutation job and by a maintainer running the sweep locally.
mutation = [
    "cosmic-ray>=8.4",
    # Security floor for cosmic-ray's repository tooling (CVE-2026-114145).
    "gitpython>=3.2.1",
    # cosmic-ray pulls aiohttp. Exclude the multidict C-extension reference
    # leak (CVE-2026-104874) without adding aio-libs to runtime dependencies.
    "multidict>=6.9.1",
]

[tool.uv]
# CI, release, installers and the container select uv 0.13.5. The security
# floor excludes uv's affected bundled CA store (GHSA-hq85-5cpj-mr62).
# Lock-update tooling, including Dependabot, must also satisfy this floor;
# an older bundled uv must fail closed rather than retain the old exception.
# Allow reviewed 0.13 patches; review the next minor before admitting it.
required-version = ">=0.13.4,<0.14"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: tests that hit real network endpoints (deselect with '-m not integration')",
    "hostile_input: adversarial / oversized / malformed parser inputs and fuzz suites; run as a dedicated CI gate with '-m hostile_input'",
]
addopts = "-m 'not integration'"

[tool.coverage.report]
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Rule selection rationale:
#   E, F, W: pycodestyle / pyflakes baseline
#   I: import sorting (isort)
#   UP: pyupgrade; keeps syntax current to target-version
#   B: flake8-bugbear; real-bug patterns (mutable defaults, unused
#             loop vars, raise-without-from, etc.)
#   SIM: flake8-simplify; collapses verbose idioms
#   S: bandit-via-ruff; security-adjacent lints
#   PT: pytest style
#   PLW: pylint warnings
#   RUF: ruff-native rules; small quality wins
#   C4: comprehension improvements
#   PIE: misc improvements (no-self-assign, unused-star, etc.)
#   RET: return-statement cleanup
#   G: logging-format sanity
#   C901: mccabe cyclomatic complexity cap (max 15, see [tool.ruff.lint.mccabe])
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "PT", "PLW", "RUF", "C4", "PIE", "RET", "G", "C901"]
# We use smart quotes in some docstrings and user-facing strings; ruff's
# ambiguous-unicode warnings are noise in prose-heavy comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
# Cyclomatic-complexity cap. Every function must come in under 15. The 28
# functions over the cap when this gate was first enabled (v1.9.37) carried an
# explicit `# noqa: C901` and were decomposed incrementally; that backlog was
# fully cleared in v1.9.76 (Track A), so no `# noqa: C901` markers remain and
# the cap now holds the whole tree, not just new code. See docs/roadmap.md
# (complexity gate).
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "S101"]  # allow assert in tests
# Typer command signatures declaratively expose each independent CLI option.
"src/recon_tool/cli/capsule.py" = ["PLR0913"]
"src/recon_tool/cli/review.py" = ["PLR0913"]
"validation/aggregate/make_synthetic_cohort.py" = ["S311"]  # seeded RNG for synthetic fixtures, not cryptographic
"validation/layer_ablation.py" = ["S311"]  # seeded RNG for synthetic worlds / planted partitions, not cryptographic
"tests/test_layer_ablation.py" = ["S311"]  # seeded RNG driving the synthetic fixtures under test

[tool.bandit]
# Bandit duplicates ruff's S-rules. We keep bandit available for
# defense-in-depth (it catches a few niche patterns ruff doesn't) but
# skip the three IDs we've already reviewed and suppressed at the
# ruff level with ``# noqa: S...`` annotations; otherwise every run
# shows the same nine already-handled findings.
#
# B311: ``random.choice(_STATUS_MESSAGES)`` for spinner text. Not
#        cryptographic; the Python doc itself says ``random`` is fine
#        for non-security uses.
# B404: ``import subprocess`` in cli.py for the ``fingerprints check``
#        wrapper. Used only to invoke our own validator script with a
#        Path object argument.
# B603: ``subprocess.run(cmd, check=False)`` at the same call site as B404.
#        No shell, no user-controlled command parts, Path is validated
#        with ``.exists()`` before invocation.
# B406: ``from xml.sax.saxutils import escape`` in userrealm.py. Used
#        for escaping OUTGOING request bodies (we're writing XML, not
#        parsing untrusted XML). (B405 was eliminated in 1.9.24 hygiene pass
#        by removing the unused stdlib xml.etree import entirely.)
exclude_dirs = ["tests", ".venv", "dist", "build"]
skips = ["B311", "B404", "B603", "B406"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# Resolve imports through the local checkout's editable install in
# .venv rather than any stale user-site install elsewhere on the
# system. Without these, ``python -m pyright .`` can pick up a
# previously-released recon-tool wheel from ~/AppData/Roaming/Python
# and report phantom "no parameter named X" errors against schema
# additions that only exist in the working copy.
venv = ".venv"
venvPath = "."
# Resolve the src-layout package (recon_tool, under src/) and repo-root
# packages (validation) for imports without analyzing all of validation/.
# tests/test_drift_check.py imports validation.drift_check, and at runtime
# pytest puts the repo root on sys.path; mirror that for pyright, plus src/ so
# `import recon_tool` resolves to the source under the src layout.
extraPaths = [".", "src"]
include = ["src/recon_tool", "tests", "validation/corpus_aggregator.py", "validation/drift_check.py", "validation/quality_arm_identifiability.py", "scripts/check_typing_policy.py", "validation/catalog_result_input.py"]
# All strict diagnostic families apply by default, including to tests.
# Exact legacy exceptions and their ownership are documented and ratcheted in
# docs/typing-policy.md and docs/typing-exceptions.json.
reportMissingModuleSource = "error"
